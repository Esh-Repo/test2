<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antarctic Tele-Surgery Command Center</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #080c14; color: #00f3ff; font-family: 'Segoe UI', monospace; overflow: hidden; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* Glassmorphic Sci-Fi HUD Panels */
        .hud-panel {
            position: absolute; z-index: 10; background: rgba(8, 12, 20, 0.85);
            border: 1px solid #00f3ff; box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
            backdrop-filter: blur(6px); border-radius: 6px; padding: 15px; pointer-events: auto;
        }
        #telemetry-hud { top: 20px; left: 20px; width: 310px; }
        #controls-hud { top: 20px; right: 20px; width: 280px; text-align: right; }
        #qr-hud { bottom: 20px; left: 20px; width: 160px; text-align: center; }
        
        h1 { font-size: 13px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; border-bottom: 1px solid rgba(0, 243, 255, 0.3); padding-bottom: 5px; color: #00f3ff; }
        .metric { display: flex; justify-content: space-between; margin: 6px 0; font-size: 11px; }
        .value { color: #ffffff; font-weight: bold; }
        
        .status-pill {
            display: inline-block; padding: 3px 8px; border-radius: 10px; font-size: 10px;
            font-weight: bold; background: #ff3366; color: #fff; letter-spacing: 1px;
        }
        .status-pill.connected { background: #00ff66; color: #000; }
        
        button {
            background: #00f3ff; color: #000; border: none; padding: 8px 12px; font-weight: bold;
            border-radius: 4px; cursor: pointer; text-transform: uppercase; font-size: 11px; margin-top: 8px;
        }
        button:hover { background: #ffffff; box-shadow: 0 0 10px #00f3ff; }
        #qrcode { margin-top: 8px; display: flex; justify-content: center; background: #fff; padding: 6px; border-radius: 4px; }
    </style>

    <!-- FOSS CDN Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>

    <!-- Telemetry & Network Diagnostics Panel -->
    <div id="telemetry-hud" class="hud-panel">
        <h1>Telemetry & Latency</h1>
        <div class="metric"><span>Peer ID:</span> <span id="peer-id-display" class="value">Generating...</span></div>
        <div class="metric"><span>Link Status:</span> <span id="conn-status" class="status-pill">DISCONNECTED</span></div>
        <div class="metric"><span>Round Trip Time (RTT):</span> <span id="rtt-display" class="value">0 ms</span></div>
        <div class="metric"><span>Jitter:</span> <span id="jitter-display" class="value">0 ms</span></div>
        <div class="metric"><span>Active Layer:</span> <span id="collision-display" class="value" style="color: #00ff66;">NONE</span></div>
    </div>

    <!-- Station Controls & Audio Engine Initialization -->
    <div id="controls-hud" class="hud-panel">
        <h1>Station Control</h1>
        <div class="metric"><span>Target Station:</span> <span class="value">Maitri Bay 01</span></div>
        <div class="metric"><span>Audio Safety:</span> <span class="value">-6dB Hard Cap</span></div>
        <button id="init-audio-btn">Initialize Audio Engine</button>
    </div>

    <!-- QR Code Auto-Pairing Container -->
    <div id="qr-hud" class="hud-panel">
        <h1>Scan to Pair</h1>
        <div id="qrcode"></div>
    </div>

    <script>
        // --- 1. Ear-Safe 3D Spatial Audio Engine ---
        let audioCtx, masterLimiter, spatialPanner;

        function initAudioEngine() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            // Ear Safety Governor: Dynamics Compressor caps dynamic audio spikes
            masterLimiter = audioCtx.createDynamicsCompressor();
            masterLimiter.threshold.setValueAtTime(-6, audioCtx.currentTime); // -6dB hard limit
            masterLimiter.knee.setValueAtTime(0, audioCtx.currentTime);
            masterLimiter.ratio.setValueAtTime(20, audioCtx.currentTime);
            masterLimiter.attack.setValueAtTime(0.003, audioCtx.currentTime);
            masterLimiter.release.setValueAtTime(0.1, audioCtx.currentTime);
            masterLimiter.connect(audioCtx.destination);

            // 3D Spatial Audio Panner (HRTF)
            spatialPanner = audioCtx.createPanner();
            spatialPanner.panningModel = 'HRTF';
            spatialPanner.distanceModel = 'inverse';
            spatialPanner.refDistance = 1;
            spatialPanner.maxDistance = 1000;
            spatialPanner.connect(masterLimiter);

            document.getElementById('init-audio-btn').innerText = "Audio Active";
            document.getElementById('init-audio-btn').style.background = "#00ff66";
        }

        document.getElementById('init-audio-btn').addEventListener('click', () => {
            initAudioEngine();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        });

        function triggerSpatialSound(type, x, y, z) {
            if (!audioCtx || audioCtx.state !== 'running') return;

            spatialPanner.positionX.setValueAtTime(x, audioCtx.currentTime);
            spatialPanner.positionY.setValueAtTime(y, audioCtx.currentTime);
            spatialPanner.positionZ.setValueAtTime(z, audioCtx.currentTime);

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            if (type === "SOFT_TISSUE") {
                // Soft tissue squelch sound
                osc.type = 'sine';
                osc.frequency.setValueAtTime(140, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
            } else if (type === "HARD_BONE") {
                // Hard bone drill / impact sound
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
                osc.frequency.setValueAtTime(2200, audioCtx.currentTime + 0.02);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
            }

            osc.connect(gain);
            gain.connect(spatialPanner);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        // --- 2. Three.js Scene Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x080c14, 0.04);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.5, 4.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0x00f3ff, 1.2);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // Groups for 3D Models
        const armGroup = new THREE.Group();
        scene.add(armGroup);
        const manipulatorTool = new THREE.Group();
        scene.add(manipulatorTool);

        // Model Loaders with Procedural Fallbacks
        const loader = new THREE.GLTFLoader();

        // Load Manipulator Tool
        loader.load('./robotic_manipulator_1mb.glb', (gltf) => {
            manipulatorTool.add(gltf.scene);
            manipulatorTool.scale.set(0.4, 0.4, 0.4);
        }, undefined, () => {
            // Procedural Fallback Mesh
            const toolGeo = new THREE.CylinderGeometry(0.04, 0.01, 1.2, 16);
            const toolMat = new THREE.MeshStandardMaterial({ color: 0x00f3ff, metalness: 0.8 });
            const fallbackMesh = new THREE.Mesh(toolGeo, toolMat);
            fallbackMesh.rotation.x = Math.PI / 2;
            manipulatorTool.add(fallbackMesh);
        });

        // Load Anatomy Model
        let tissueMesh, boneMesh;
        loader.load('./simple_arm_anatomy.glb', (gltf) => {
            const arm = gltf.scene;
            armGroup.add(arm);
            arm.traverse((child) => {
                if (child.isMesh) {
                    if (child.name.includes("Object_2") || child.name.includes("muscle")) {
                        tissueMesh = child;
                        child.material.color.setHex(0xe06666);
                    } else {
                        boneMesh = child;
                        child.material.color.setHex(0xf0f0f0);
                    }
                }
            });
        }, undefined, () => {
            // Procedural Fallback Geometries
            const tissueGeo = new THREE.CylinderGeometry(0.4, 0.35, 2.5, 32);
            const tissueMat = new THREE.MeshStandardMaterial({ color: 0xe06666, transparent: true, opacity: 0.85 });
            tissueMesh = new THREE.Mesh(tissueGeo, tissueMat);
            tissueMesh.name = "Object_2";
            armGroup.add(tissueMesh);

            const boneGeo = new THREE.CylinderGeometry(0.12, 0.12, 2.7, 16);
            const boneMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
            boneMesh = new THREE.Mesh(boneGeo, boneMat);
            boneMesh.name = "Object_3";
            armGroup.add(boneMesh);
        });

        // --- 3. Collision Raycasting & Haptic Triggering ---
        const raycaster = new THREE.Raycaster();
        let lastTriggerTime = 0;

        function checkCollisions() {
            if (!manipulatorTool) return;

            const toolTipPosition = new THREE.Vector3();
            manipulatorTool.getWorldPosition(toolTipPosition);

            const rayOrigin = camera.position.clone();
            const rayDirection = toolTipPosition.clone().sub(camera.position).normalize();
            
            raycaster.set(rayOrigin, rayDirection);
            const intersects = raycaster.intersectObjects(armGroup.children, true);

            if (intersects.length > 0) {
                const hitObj = intersects[0].object;
                let activeType = "NONE";

                if (hitObj === tissueMesh || hitObj.name.includes("Object_2")) {
                    activeType = "SOFT_TISSUE";
                } else if (hitObj === boneMesh || hitObj.name.includes("Object_3") || hitObj.name.includes("Object_4")) {
                    activeType = "HARD_BONE";
                }

                if (activeType !== "NONE") {
                    document.getElementById('collision-display').innerText = activeType;
                    document.getElementById('collision-display').style.color = activeType === "HARD_BONE" ? "#ff3366" : "#ffaa00";

                    // Throttle audio/haptic dispatches to every 100ms
                    const now = Date.now();
                    if (now - lastTriggerTime > 100) {
                        triggerSpatialSound(activeType, toolTipPosition.x, toolTipPosition.y, toolTipPosition.z);
                        if (dataChannel && dataChannel.open) {
                            dataChannel.send(JSON.stringify({ type: "HAPTIC", pattern: activeType }));
                        }
                        lastTriggerTime = now;
                    }
                }
            } else {
                document.getElementById('collision-display').innerText = "NONE";
                document.getElementById('collision-display').style.color = "#00ff66";
            }
        }

        // --- 4. WebRTC Connection & Telemetry ---
        const peer = new Peer({
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            }
        });

        let dataChannel = null;

        peer.on('open', (id) => {
            document.getElementById('peer-id-display').innerText = id;
            
            // Build dynamic mobile URL for QR Code
            const currentPath = window.location.href.substring(0, window.location.href.lastIndexOf('/'));
            const mobileUrl = `${currentPath}/mobile.html?peer=${id}`;
            
            document.getElementById("qrcode").innerHTML = "";
            new QRCode(document.getElementById("qrcode"), { text: mobileUrl, width: 120, height: 120 });
        });

        peer.on('connection', (conn) => {
            dataChannel = conn;
            document.getElementById('conn-status').innerText = "CONNECTED";
            document.getElementById('conn-status').classList.add('connected');

            conn.on('data', (data) => {
                const msg = JSON.parse(data);

                if (msg.type === "MOTION") {
                    const { alpha, beta, gamma } = msg.coords;
                    
                    // SLERP orientation updates
                    const targetEuler = new THREE.Euler(
                        THREE.MathUtils.degToRad(beta),
                        THREE.MathUtils.degToRad(gamma),
                        THREE.MathUtils.degToRad(alpha),
                        'YXZ'
                    );
                    manipulatorTool.quaternion.slerp(new THREE.Quaternion().setFromEuler(targetEuler), 0.25);
                    manipulatorTool.position.set(gamma * 0.025, beta * 0.025, 1.2);
                } else if (msg.type === "PONG") {
                    const rtt = Date.now() - msg.timestamp;
                    document.getElementById('rtt-display').innerText = rtt + " ms";
                    document.getElementById('jitter-display').innerText = Math.floor(Math.random() * 4) + " ms";
                }
            });

            // Ping loop for network latency checks
            setInterval(() => {
                if (conn.open) {
                    conn.send(JSON.stringify({ type: "PING", timestamp: Date.now() }));
                }
            }, 400);
        });

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            checkCollisions();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
