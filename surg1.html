<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robotic Surgical Station - Command Center</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #f1f5f9; color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow: hidden; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* Light-Mode Glassmorphic HUD */
        .hud-panel {
            position: absolute; z-index: 10; background: rgba(255, 255, 255, 0.90);
            border: 1px solid #cbd5e1; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
            backdrop-filter: blur(8px); border-radius: 8px; padding: 14px; pointer-events: auto;
        }
        #telemetry-hud { top: 20px; left: 20px; width: 290px; }
        #controls-hud { top: 20px; right: 20px; width: 280px; text-align: right; }
        #qr-hud { bottom: 20px; left: 20px; width: 150px; text-align: center; }
        
        h1 { font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; border-bottom: 2px solid #e2e8f0; padding-bottom: 4px; color: #2563eb; font-weight: 800; }
        .metric { display: flex; justify-content: space-between; margin: 5px 0; font-size: 11px; font-weight: 600; }
        .value { color: #0f172a; font-family: monospace; font-weight: 700; }
        
        .status-pill {
            display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 10px;
            font-weight: 800; background: #ef4444; color: #fff; letter-spacing: 0.5px;
        }
        .status-pill.connected { background: #22c55e; color: #fff; }
        
        button {
            background: #2563eb; color: #ffffff; border: none; padding: 8px 12px; font-weight: bold;
            border-radius: 6px; cursor: pointer; text-transform: uppercase; font-size: 11px; margin-top: 6px;
        }
        button:hover { background: #1d4ed8; }
        #qrcode { margin-top: 6px; display: flex; justify-content: center; background: #fff; padding: 4px; border-radius: 4px; border: 1px solid #e2e8f0; }
    </style>

    <!-- Reputed FOSS CDN Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>

    <!-- Diagnostic HUD -->
    <div id="telemetry-hud" class="hud-panel">
        <h1>Telemetry & State</h1>
        <div class="metric"><span>Peer ID:</span> <span id="peer-id-display" class="value">Generating...</span></div>
        <div class="metric"><span>Link Status:</span> <span id="conn-status" class="status-pill">DISCONNECTED</span></div>
        <div class="metric"><span>Active Tool:</span> <span id="tool-display" class="value">SCALPEL</span></div>
        <div class="metric"><span>Target Tissue:</span> <span id="target-display" class="value">SKIN</span></div>
        <div class="metric"><span>Layer Collision:</span> <span id="collision-display" class="value" style="color: #64748b;">NONE</span></div>
    </div>

    <!-- Audio Safety & Station HUD -->
    <div id="controls-hud" class="hud-panel">
        <h1>Audio Control</h1>
        <div class="metric"><span>Audio Governor:</span> <span class="value">-6dB Hard Cap</span></div>
        <button id="init-audio-btn">Initialize Audio Engine</button>
    </div>

    <!-- Auto-Pairing QR Code -->
    <div id="qr-hud" class="hud-panel">
        <h1>Scan Gamepad</h1>
        <div id="qrcode"></div>
    </div>

    <script>
        // --- 1. Audio Engine with Ear-Safety Governor ---
        let audioCtx, masterLimiter, spatialPanner;

        function initAudioEngine() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            // Dynamics Compressor Hard Limiter caps dynamic audio spikes
            masterLimiter = audioCtx.createDynamicsCompressor();
            masterLimiter.threshold.setValueAtTime(-6, audioCtx.currentTime); // -6dB safety limit
            masterLimiter.knee.setValueAtTime(0, audioCtx.currentTime);
            masterLimiter.ratio.setValueAtTime(20, audioCtx.currentTime);
            masterLimiter.attack.setValueAtTime(0.003, audioCtx.currentTime);
            masterLimiter.release.setValueAtTime(0.1, audioCtx.currentTime);
            masterLimiter.connect(audioCtx.destination);

            spatialPanner = audioCtx.createPanner();
            spatialPanner.panningModel = 'HRTF';
            spatialPanner.connect(masterLimiter);

            document.getElementById('init-audio-btn').innerText = "Audio Active";
            document.getElementById('init-audio-btn').style.background = "#22c55e";
        }

        document.getElementById('init-audio-btn').addEventListener('click', () => {
            initAudioEngine();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        });

        // Tool & Tissue Audio Generator
        function triggerProceduralSound(tool, material) {
            if (!audioCtx || audioCtx.state !== 'running') return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            if (tool === "SAW" && material === "BONE") {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(850, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
            } else if (tool === "SCALPEL" && material === "SKIN") {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(420, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
            } else if (tool === "LASER") {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(1400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            } else { // Cautery / Muscle / Default
                osc.type = 'square';
                osc.frequency.setValueAtTime(210, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            }

            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(spatialPanner);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.09);
        }

        // --- 2. Light Mode Three.js Scene Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf1f5f9); // Clean slate light canvas

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2.5, 4.2);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Bright Studio Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.95));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // --- 3. Multi-Layer Anatomical Arm & Articulated Robot ---
        const anatomyGroup = new THREE.Group();
        scene.add(anatomyGroup);

        // Outer Skin Layer
        const skinGeo = new THREE.CylinderGeometry(0.75, 0.75, 3.2, 32);
        const skinMat = new THREE.MeshStandardMaterial({ color: 0xfca5a5, transparent: true, opacity: 0.55 });
        const skinMesh = new THREE.Mesh(skinGeo, skinMat);
        skinMesh.rotation.z = Math.PI / 2;
        anatomyGroup.add(skinMesh);

        // Middle Muscle Layer
        const muscleGeo = new THREE.CylinderGeometry(0.50, 0.50, 3.21, 32);
        const muscleMat = new THREE.MeshStandardMaterial({ color: 0xdc2626, transparent: true, opacity: 0.8 });
        const muscleMesh = new THREE.Mesh(muscleGeo, muscleMat);
        muscleMesh.rotation.z = Math.PI / 2;
        anatomyGroup.add(muscleMesh);

        // Inner Bone Core Layer
        const boneGeo = new THREE.CylinderGeometry(0.22, 0.22, 3.22, 32);
        const boneMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.2 });
        const boneMesh = new THREE.Mesh(boneGeo, boneMat);
        boneMesh.rotation.z = Math.PI / 2;
        anatomyGroup.add(boneMesh);

        // Articulated Robot Arm
        const robotGroup = new THREE.Group();
        scene.add(robotGroup);

        const armBaseGeo = new THREE.BoxGeometry(0.5, 0.2, 0.5);
        const armBaseMat = new THREE.MeshStandardMaterial({ color: 0x2563eb });
        const armBase = new THREE.Mesh(armBaseGeo, armBaseMat);
        robotGroup.add(armBase);

        const toolShaftGeo = new THREE.CylinderGeometry(0.04, 0.04, 1.2, 16);
        const toolShaftMat = new THREE.MeshStandardMaterial({ color: 0x475569, metalness: 0.8 });
        const toolShaft = new THREE.Mesh(toolShaftGeo, toolShaftMat);
        toolShaft.position.y = -0.6;
        robotGroup.add(toolShaft);

        const toolTipGeo = new THREE.ConeGeometry(0.06, 0.25, 16);
        const toolTipMat = new THREE.MeshStandardMaterial({ color: 0xef4444 });
        const toolTip = new THREE.Mesh(toolTipGeo, toolTipMat);
        toolTip.position.y = -1.2;
        toolTip.rotation.x = Math.PI;
        robotGroup.add(toolTip);

        robotGroup.position.set(0, 1.6, 0);

        // --- 4. Layer Collision Detection ---
        let currentTool = "SCALPEL";
        let currentTargetMat = "SKIN";
        let lastAudioTrigger = 0;

        function checkToolCollisions() {
            const tipWorldPos = new THREE.Vector3();
            toolTip.getWorldPosition(tipWorldPos);

            // Calculate distance to horizontal central axis of the anatomical arm
            const distFromAxis = Math.hypot(tipWorldPos.y, tipWorldPos.z);
            let activeCollision = "NONE";

            if (distFromAxis <= 0.22) {
                activeCollision = "BONE";
            } else if (distFromAxis <= 0.50) {
                activeCollision = "MUSCLE";
            } else if (distFromAxis <= 0.75) {
                activeCollision = "SKIN";
            }

            const collisionElem = document.getElementById('collision-display');
            collisionElem.innerText = activeCollision;

            if (activeCollision !== "NONE") {
                collisionElem.style.color = activeCollision === "BONE" ? "#0f172a" : activeCollision === "MUSCLE" ? "#ef4444" : "#d97706";

                const now = Date.now();
                if (now - lastAudioTrigger > 90) {
                    triggerProceduralSound(currentTool, activeCollision);
                    if (dataChannel && dataChannel.open) {
                        dataChannel.send(JSON.stringify({ type: "HAPTIC", pattern: activeCollision }));
                    }
                    lastAudioTrigger = now;
                }
            } else {
                collisionElem.style.color = "#64748b";
            }
        }

        // --- 5. WebRTC Network Engine ---
        const peer = new Peer({
            config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] }
        });

        let dataChannel = null;

        peer.on('open', (id) => {
            document.getElementById('peer-id-display').innerText = id;
            
            const currentPath = window.location.href.substring(0, window.location.href.lastIndexOf('/'));
            const mobileUrl = `${currentPath}/mobile.html?peer=${id}`;
            
            document.getElementById("qrcode").innerHTML = "";
            new QRCode(document.getElementById("qrcode"), { text: mobileUrl, width: 110, height: 110 });
        });

        peer.on('connection', (conn) => {
            dataChannel = conn;
            document.getElementById('conn-status').innerText = "CONNECTED";
            document.getElementById('conn-status').classList.add('connected');

            conn.on('data', (data) => {
                const msg = JSON.parse(data);

                if (msg.type === "GAMEPAD") {
                    currentTool = msg.tool;
                    currentTargetMat = msg.targetMat;
                    document.getElementById('tool-display').innerText = currentTool;
                    document.getElementById('target-display').innerText = currentTargetMat;

                    // Apply gamepad translations smoothly
                    const targetX = msg.x * 1.5;
                    const targetY = 1.2 - (msg.z * 1.5);
                    const targetZ = msg.y * 1.0;

                    robotGroup.position.x += (targetX - robotGroup.position.x) * 0.2;
                    robotGroup.position.y += (targetY - robotGroup.position.y) * 0.2;
                    robotGroup.position.z += (targetZ - robotGroup.position.z) * 0.2;
                }
            });
        });

        function animate() {
            requestAnimationFrame(animate);
            checkToolCollisions();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
