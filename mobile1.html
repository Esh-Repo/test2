<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Surgical Gamepad Controller</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: manipulation; }
        body { background: #f8fafc; color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 12px; overflow: hidden; }
        
        .header { text-align: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 6px; }
        .header h1 { font-size: 14px; letter-spacing: 1px; text-transform: uppercase; color: #2563eb; font-weight: 800; }
        
        .card { background: #ffffff; padding: 10px; border-radius: 10px; border: 1px solid #cbd5e1; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .connect-box { display: flex; flex-direction: column; gap: 6px; }
        input { background: #f1f5f9; border: 1px solid #94a3b8; color: #0f172a; padding: 10px; font-size: 14px; border-radius: 6px; text-align: center; font-family: monospace; font-weight: bold; }
        
        button { background: #2563eb; color: #ffffff; border: none; padding: 10px; font-weight: bold; border-radius: 6px; font-size: 12px; text-transform: uppercase; cursor: pointer; letter-spacing: 0.5px; }
        button:active { background: #1d4ed8; }

        /* Gamepad Control Layout */
        .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; height: 180px; align-items: center; }
        
        /* Virtual Joystick */
        .joystick-container { width: 140px; height: 140px; background: #e2e8f0; border-radius: 50%; border: 2px solid #94a3b8; position: relative; margin: 0 auto; touch-action: none; display: flex; align-items: center; justify-content: center; }
        .joystick-knob { width: 50px; height: 50px; background: #2563eb; border-radius: 50%; position: absolute; box-shadow: 0 4px 10px rgba(37, 99, 235, 0.4); pointer-events: none; }

        /* Depth / Z-Axis Slider */
        .depth-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 6px; }
        .depth-container label { font-size: 11px; font-weight: bold; color: #64748b; text-transform: uppercase; }
        .depth-slider { -webkit-appearance: slider-vertical; width: 35px; height: 120px; accent-color: #2563eb; }

        /* Selectors */
        .selector-group { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
        .selector-title { font-size: 10px; font-weight: 800; color: #64748b; text-transform: uppercase; }
        .btn-group { display: flex; gap: 4px; }
        .btn-option { flex: 1; padding: 8px 4px; font-size: 10px; background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; border-radius: 4px; font-weight: bold; }
        .btn-option.active { background: #2563eb; color: #ffffff; border-color: #2563eb; }

        /* Haptic Feedback Indicator */
        #haptic-indicator { height: 45px; border: 2px dashed #cbd5e1; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; text-transform: uppercase; font-weight: bold; color: #64748b; background: #ffffff; }
        #haptic-indicator.active-skin { background: #fef3c7; border-color: #d97706; color: #d97706; }
        #haptic-indicator.active-muscle { background: #fee2e2; border-color: #dc2626; color: #dc2626; }
        #haptic-indicator.active-bone { background: #f1f5f9; border-color: #475569; color: #0f172a; }
    </style>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
    <div class="header">
        <h1>Robotic Tele-Gamepad</h1>
    </div>

    <!-- Pairing Panel -->
    <div class="card connect-box" id="conn-panel">
        <input type="text" id="target-peer-id" placeholder="Enter Station Peer ID">
        <button id="connect-btn">Connect Gamepad</button>
    </div>

    <!-- Visual Feedback Indicator -->
    <div id="haptic-indicator">Surface Neutral</div>

    <!-- Game Controls -->
    <div class="card controls-grid">
        <div>
            <div class="selector-title" style="text-align: center; margin-bottom: 4px;">XY Movement</div>
            <div class="joystick-container" id="joystick-zone">
                <div class="joystick-knob" id="joystick-knob"></div>
            </div>
        </div>
        <div class="depth-container">
            <label>Z-Depth</label>
            <input type="range" min="0" max="100" value="0" class="depth-slider" id="depth-input">
        </div>
    </div>

    <!-- Tool & Material Selections -->
    <div class="card">
        <div class="selector-group">
            <div class="selector-title">Active Tool</div>
            <div class="btn-group" id="tool-group">
                <button class="btn-option active" data-tool="SCALPEL">Scalpel</button>
                <button class="btn-option" data-tool="SAW">Bone Saw</button>
                <button class="btn-option" data-tool="LASER">Laser</button>
                <button class="btn-option" data-tool="CAUTERY">Cautery</button>
            </div>
        </div>
        <div class="selector-group">
            <div class="selector-title">Target Preset</div>
            <div class="btn-group" id="material-group">
                <button class="btn-option active" data-mat="SKIN">Skin Layer</button>
                <button class="btn-option" data-mat="MUSCLE">Muscle Layer</button>
                <button class="btn-option" data-mat="BONE">Bone Layer</button>
            </div>
        </div>
    </div>

    <script>
        const peer = new Peer({
            config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] }
        });

        let conn = null;
        let isConnected = false;
        let selectedTool = "SCALPEL";
        let selectedMaterial = "SKIN";

        // Auto-connect URL query logic
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const peerId = params.get('peer');
            if (peerId) {
                document.getElementById('target-peer-id').value = peerId;
                initConnection(peerId);
            }
        });

        document.getElementById('connect-btn').addEventListener('click', () => {
            const peerId = document.getElementById('target-peer-id').value.trim();
            if (!peerId) return alert("Please enter Peer ID");
            initConnection(peerId);
        });

        function initConnection(peerId) {
            conn = peer.connect(peerId, { reliable: true });

            conn.on('open', () => {
                isConnected = true;
                document.getElementById('conn-panel').style.display = 'none';
                startControlLoop();
            });

            conn.on('data', (data) => {
                const msg = JSON.parse(data);
                if (msg.type === "HAPTIC") {
                    triggerHaptics(msg.pattern);
                }
            });

            conn.on('close', () => {
                alert("Connection lost");
                location.reload();
            });
        }

        // Selection Handlers
        document.querySelectorAll('#tool-group .btn-option').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('#tool-group .btn-option').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                selectedTool = e.target.dataset.tool;
            });
        });

        document.querySelectorAll('#material-group .btn-option').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('#material-group .btn-option').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                selectedMaterial = e.target.dataset.mat;
            });
        });

        // Joystick Controls
        const joystickZone = document.getElementById('joystick-zone');
        const joystickKnob = document.getElementById('joystick-knob');
        let joyX = 0, joyY = 0;

        function handleTouch(e) {
            if (!e.touches[0]) return;
            const rect = joystickZone.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            let dx = e.touches[0].clientX - centerX;
            let dy = e.touches[0].clientY - centerY;
            const maxRadius = rect.width / 2 - 25;

            const distance = Math.hypot(dx, dy);
            if (distance > maxRadius) {
                dx = (dx / distance) * maxRadius;
                dy = (dy / distance) * maxRadius;
            }

            joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
            joyX = dx / maxRadius; // Normalized -1 to 1
            joyY = dy / maxRadius; // Normalized -1 to 1
        }

        function resetJoystick() {
            joystickKnob.style.transform = `translate(0px, 0px)`;
            joyX = 0; joyY = 0;
        }

        joystickZone.addEventListener('touchstart', handleTouch);
        joystickZone.addEventListener('touchmove', handleTouch);
        joystickZone.addEventListener('touchend', resetJoystick);

        // Control Loop Dispatch
        function startControlLoop() {
            setInterval(() => {
                if (!isConnected || !conn || !conn.open) return;
                const depthVal = parseFloat(document.getElementById('depth-input').value) / 100;

                conn.send(JSON.stringify({
                    type: "GAMEPAD",
                    x: joyX,
                    y: joyY,
                    z: depthVal,
                    tool: selectedTool,
                    targetMat: selectedMaterial
                }));
            }, 30);
        }

        // Vibration Dispatcher
        function triggerHaptics(type) {
            const indicator = document.getElementById('haptic-indicator');
            
            if (type === "SKIN" && navigator.vibrate) {
                navigator.vibrate([10, 20, 10]);
                indicator.className = "active-skin";
                indicator.innerText = "Skin Surface Contact";
            } else if (type === "MUSCLE" && navigator.vibrate) {
                navigator.vibrate([25, 15, 25]);
                indicator.className = "active-muscle";
                indicator.innerText = "Muscle Tissue Contact";
            } else if (type === "BONE" && navigator.vibrate) {
                navigator.vibrate([45, 10, 45, 10, 45]);
                indicator.className = "active-bone";
                indicator.innerText = "Hard Bone Contact";
            }

            setTimeout(() => {
                indicator.className = "";
                indicator.innerText = "Surface Neutral";
            }, 100);
        }
    </script>
</body>
</html>
